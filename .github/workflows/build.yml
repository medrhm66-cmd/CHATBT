name: Build ChatBT APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.36" setuptools wheel virtualenv

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show short error summary
        if: failure()
        run: |
          echo "=============== ERRORS (grep) ==============="
          grep -n -i -E "error:|fatal|failed|Command failed|No such file|not found|Traceback" build.log | tail -n 40 || true
          echo "=============== LAST 60 LINES ==============="
          tail -n 60 build.log || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatBT-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp bin/*.apk ChatBT.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ChatBT (آخر نسخة)
          files: ChatBT.apk
